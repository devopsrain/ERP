{% extends "multicompany/base.html" %}
{% block title %}{{ _('Edit Project') if action=='edit' else _('New Project') }}{% endblock %}
{% block content %}
<div style="max-width:800px;margin:0 auto;padding:30px 20px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-kanban text-success"></i> {{ _('Edit Project') if action=='edit' else _('New Project') }}</h2>
    <a href="/project/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> {{ _('Back') }}</a>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST" action="/project/new">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="row g-3">
          <div class="col-md-8"><label class="form-label fw-semibold">{{ _('Project Name') }} <span class="text-danger">*</span></label><input name="name" class="form-control" value="{{ project.name or '' }}" required></div>
          <div class="col-md-4"><label class="form-label fw-semibold">{{ _('Status') }}</label>
            <select name="status" class="form-select">
              <option value="active" {{ 'selected' if project.status=='active' }}>{{ _('Active') }}</option>
              <option value="on_hold" {{ 'selected' if project.status=='on_hold' }}>{{ _('On Hold') }}</option>
              <option value="completed" {{ 'selected' if project.status=='completed' }}>{{ _('Completed') }}</option>
              <option value="cancelled" {{ 'selected' if project.status=='cancelled' }}>{{ _('Cancelled') }}</option>
            </select>
          </div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Client Name') }}</label><input name="client_name" class="form-control" value="{{ project.client_name or '' }}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Project Manager') }}</label><input name="project_manager" class="form-control" value="{{ project.project_manager or '' }}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Start Date') }}</label><input name="start_date" type="date" class="form-control" value="{{ project.start_date or '' }}"></div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Planned End Date') }}</label><input name="planned_end_date" type="date" class="form-control" value="{{ project.planned_end_date or '' }}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold">{{ _('Total Budget (ETB)') }}</label><input name="total_budget" type="number" step="0.01" class="form-control" value="{{ project.total_budget or 0 }}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold">{{ _('Material Costs (ETB)') }}</label><input name="material_costs" type="number" step="0.01" class="form-control" value="{{ project.material_costs or 0 }}"></div>
          <div class="col-md-4"><label class="form-label fw-semibold">{{ _('Consultant Fees (ETB)') }}</label><input name="consultant_fees" type="number" step="0.01" class="form-control" value="{{ project.consultant_fees or 0 }}"></div>
          <div class="col-12"><label class="form-label fw-semibold">{{ _('Description') }}</label><textarea name="description" class="form-control" rows="3">{{ project.description or '' }}</textarea></div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <a href="/project/" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> {{ _('Save Project') }}</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
