{% extends "multicompany/base.html" %}

{% block title %}{{ _('Request Transfer') }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1">
                    <i class="bi bi-arrow-left-right me-2"></i>{{ _('Request Transfer') }}
                </h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/machinery">{{ _('Machinery') }}</a></li>
                        <li class="breadcrumb-item"><a href="/machinery/transfers">{{ _('Transfers') }}</a></li>
                        <li class="breadcrumb-item active">{{ _('New') }}</li>
                    </ol>
                </nav>
            </div>

            <form method="post" action="/machinery/transfers/new">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">{{ _('Transfer Details') }}</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">{{ _('Asset to Transfer') }} <span class="text-danger">*</span></label>
                                <select name="asset_id" class="form-select" required id="asset-select">
                                    <option value="">-- {{ _('Select Asset') }} --</option>
                                    {% for a in assets %}
                                    <option value="{{ a.asset_id }}" 
                                            data-site="{{ a.current_site_id }}"
                                            data-site-name="{{ a.current_site_name }}"
                                            {{ 'selected' if selected_asset and selected_asset.asset_id == a.asset_id }}>
                                        {{ a.internal_code }} - {{ a.name }} 
                                        {% if a.current_site_name %}({{ _('at') }} {{ a.current_site_name }}){% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ _('From Site') }}</label>
                                <select name="from_site_id" class="form-select" id="from-site">
                                    <option value="">-- {{ _('Current Location') }} --</option>
                                    {% for s in sites %}
                                    <option value="{{ s.site_id }}"
                                            {{ 'selected' if selected_asset and selected_asset.current_site_id == s.site_id }}>
                                        {{ s.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ _('To Site') }} <span class="text-danger">*</span></label>
                                <select name="to_site_id" class="form-select" required>
                                    <option value="">-- {{ _('Select Destination') }} --</option>
                                    {% for s in sites %}
                                    <option value="{{ s.site_id }}">{{ s.name }} ({{ s.site_type }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ _('Transport Method') }}</label>
                                <select name="transport_method" class="form-select">
                                    <option value="">-- {{ _('Select') }} --</option>
                                    <option value="Self-drive">{{ _('Self-drive') }}</option>
                                    <option value="Lowbed trailer">{{ _('Lowbed trailer') }}</option>
                                    <option value="Flatbed truck">{{ _('Flatbed truck') }}</option>
                                    <option value="Towing">{{ _('Towing') }}</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ _('Estimated Duration (hours)') }}</label>
                                <input type="number" name="estimated_duration_hours" class="form-control"
                                       min="0" step="0.5" placeholder="{{ _('e.g., 4') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ _('Priority') }}</label>
                                <select name="priority" class="form-select">
                                    <option value="normal">{{ _('Normal') }}</option>
                                    <option value="high">{{ _('High') }}</option>
                                    <option value="urgent">{{ _('Urgent') }}</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">{{ _('Reason for Transfer') }}</label>
                                <textarea name="reason" class="form-control" rows="2"
                                          placeholder="{{ _('Why is this transfer needed?') }}"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">{{ _('Notes') }}</label>
                                <textarea name="notes" class="form-control" rows="2"
                                          placeholder="{{ _('Additional notes or instructions') }}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/machinery/transfers" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>{{ _('Cancel') }}
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>{{ _('Submit Request') }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('asset-select')?.addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const fromSite = document.getElementById('from-site');
    if (opt.dataset.site) {
        fromSite.value = opt.dataset.site;
    }
});
</script>
{% endblock %}
