{% extends "multicompany/base.html" %}

{% block title %}Request Transfer{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1">
                    <i class="bi bi-arrow-left-right me-2"></i>Request Transfer
                </h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/machinery">Machinery</a></li>
                        <li class="breadcrumb-item"><a href="/machinery/transfers">Transfers</a></li>
                        <li class="breadcrumb-item active">New</li>
                    </ol>
                </nav>
            </div>

            <form method="post" action="/machinery/transfers/new">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">Transfer Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Asset to Transfer <span class="text-danger">*</span></label>
                                <select name="asset_id" class="form-select" required id="asset-select">
                                    <option value="">-- Select Asset --</option>
                                    {% for a in assets %}
                                    <option value="{{ a.asset_id }}" 
                                            data-site="{{ a.current_site_id }}"
                                            data-site-name="{{ a.current_site_name }}"
                                            {{ 'selected' if selected_asset and selected_asset.asset_id == a.asset_id }}>
                                        {{ a.internal_code }} - {{ a.name }} 
                                        {% if a.current_site_name %}(at {{ a.current_site_name }}){% endif %}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">From Site</label>
                                <select name="from_site_id" class="form-select" id="from-site">
                                    <option value="">-- Current Location --</option>
                                    {% for s in sites %}
                                    <option value="{{ s.site_id }}"
                                            {{ 'selected' if selected_asset and selected_asset.current_site_id == s.site_id }}>
                                        {{ s.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">To Site <span class="text-danger">*</span></label>
                                <select name="to_site_id" class="form-select" required>
                                    <option value="">-- Select Destination --</option>
                                    {% for s in sites %}
                                    <option value="{{ s.site_id }}">{{ s.name }} ({{ s.site_type }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Transport Method</label>
                                <select name="transport_method" class="form-select">
                                    <option value="">-- Select --</option>
                                    <option value="Self-drive">Self-drive</option>
                                    <option value="Lowbed trailer">Lowbed trailer</option>
                                    <option value="Flatbed truck">Flatbed truck</option>
                                    <option value="Towing">Towing</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Estimated Duration (hours)</label>
                                <input type="number" name="estimated_duration_hours" class="form-control"
                                       min="0" step="0.5" placeholder="e.g., 4">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="normal">Normal</option>
                                    <option value="high">High</option>
                                    <option value="urgent">Urgent</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Reason for Transfer</label>
                                <textarea name="reason" class="form-control" rows="2"
                                          placeholder="Why is this transfer needed?"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Notes</label>
                                <textarea name="notes" class="form-control" rows="2"
                                          placeholder="Additional notes or instructions"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/machinery/transfers" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-send me-1"></i>Submit Request
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('asset-select')?.addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    const fromSite = document.getElementById('from-site');
    if (opt.dataset.site) {
        fromSite.value = opt.dataset.site;
    }
});
</script>
{% endblock %}
