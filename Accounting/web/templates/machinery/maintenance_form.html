{% extends "base.html" %}

{% block title %}Create Work Order{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1">
                    <i class="bi bi-tools me-2"></i>Create Work Order
                </h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="/machinery">Machinery</a></li>
                        <li class="breadcrumb-item"><a href="/machinery/maintenance">Maintenance</a></li>
                        <li class="breadcrumb-item active">New</li>
                    </ol>
                </nav>
            </div>

            <form method="post" action="/machinery/maintenance/new">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-transparent">
                        <h5 class="mb-0">Work Order Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label">Asset <span class="text-danger">*</span></label>
                                <select name="asset_id" class="form-select" required>
                                    <option value="">-- Select Asset --</option>
                                    {% for a in assets %}
                                    <option value="{{ a.asset_id }}"
                                            {{ 'selected' if selected_asset and selected_asset.asset_id == a.asset_id }}>
                                        {{ a.internal_code }} - {{ a.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Maintenance Type <span class="text-danger">*</span></label>
                                <select name="maintenance_type" class="form-select" required>
                                    {% for t in maintenance_types %}
                                    <option value="{{ t }}">{{ t | replace('_', ' ') | title }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Priority</label>
                                <select name="priority" class="form-select">
                                    <option value="normal">Normal</option>
                                    <option value="high">High</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Title</label>
                                <input type="text" name="title" class="form-control"
                                       placeholder="Brief description, e.g., 500-Hour Preventive Service">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3"
                                          placeholder="Detailed description of work to be performed"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Scheduled Date</label>
                                <input type="date" name="scheduled_date" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Due Date</label>
                                <input type="date" name="due_date" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Workshop</label>
                                <select name="workshop_id" class="form-select">
                                    <option value="">-- Select Workshop --</option>
                                    {% for w in workshops %}
                                    <option value="{{ w.site_id }}">{{ w.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Assigned Technician</label>
                                <input type="text" name="assigned_technician_name" class="form-control"
                                       placeholder="Technician name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Engine Hours at Service</label>
                                <input type="number" name="engine_hours_at_service" class="form-control" step="0.1"
                                       placeholder="Current engine hours">
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-4">
                                    <input type="checkbox" name="requires_approval" class="form-check-input" id="requires-approval">
                                    <label class="form-check-label" for="requires-approval">
                                        Requires Approval Before Starting
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/machinery/maintenance" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Create Work Order
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
