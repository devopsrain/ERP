{# Shared HRM module navigation #}
{% set hrm_path = request.url.path %}
<div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
  <h2 class="mb-2"><i class="bi bi-people-fill"></i> Human Resources</h2>
</div>
<ul class="nav nav-pills flex-wrap gap-1 mb-4">
  <li class="nav-item"><a class="nav-link {% if hrm_path == '/hrm/analytics' %}active{% endif %}" href="/hrm/analytics"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
  <li class="nav-item"><a class="nav-link {% if hrm_path == '/hrm/leave' %}active{% endif %}" href="/hrm/leave"><i class="bi bi-calendar-check"></i> Leave Requests</a></li>

  <li class="nav-item"><a class="nav-link {% if hrm_path == '/hrm/ess' %}active{% endif %}" href="/hrm/ess"><i class="bi bi-person-circle"></i> Self-Service</a></li>
</ul>
