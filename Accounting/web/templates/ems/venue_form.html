{% extends "multicompany/base.html" %}
{% block title %}{{ _('Add Venue') }}{% endblock %}
{% block content %}
<div style="max-width:700px;margin:0 auto;padding:30px 20px">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-building-add text-primary"></i> {{ _('Add Venue') }}</h2>
    <a href="/ems/venues" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> {{ _('Back') }}</a>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST" action="/ems/venues/new">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="row g-3">
          <div class="col-12"><label class="form-label fw-semibold">{{ _('Venue Name') }} <span class="text-danger">*</span></label><input name="name" class="form-control" required></div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Capacity (people)') }}</label><input name="capacity" type="number" class="form-control" value="100"></div>
          <div class="col-md-6"><label class="form-label fw-semibold">{{ _('Hourly Rate (ETB)') }}</label><input name="hourly_rate" type="number" step="0.01" class="form-control" value="0"></div>
          <div class="col-12"><label class="form-label fw-semibold">{{ _('Layout Options') }}</label><input name="layout_options" class="form-control" placeholder="banquet,theatre,classroom,boardroom"></div>
          <div class="col-12"><label class="form-label fw-semibold">{{ _('Description') }}</label><textarea name="description" class="form-control" rows="3"></textarea></div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <a href="/ems/venues" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> {{ _('Add Venue') }}</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
