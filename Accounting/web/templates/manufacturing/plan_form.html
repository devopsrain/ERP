{% extends "multicompany/base.html" %}
{% block title %}{{ _('New Production Plan') }}{% endblock %}
{% block content %}
{% include "manufacturing/_sidebar.html" %}
<div class="content-with-sidebar">
  <div class="container-fluid" style="max-width:800px">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2><i class="bi bi-plus-circle text-primary"></i> {{ _('New Production Plan') }}</h2>
      <a href="{{ url_for('manufacturing.plans') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> {{ _('Back') }}</a>
    </div>
    {% include "manufacturing/_flash.html" %}
    <form method="post" action="{{ url_for('manufacturing.plan_new_post') }}">
      <div class="card mb-4"><div class="card-body"><div class="row g-3">
        <div class="col-md-4"><label class="form-label">{{ _('Period type') }}</label>
          <select name="period_type" class="form-select">{% for p in plan_periods %}<option value="{{ p }}" {% if plan.get('period_type','monthly') == p %}selected{% endif %}>{{ _(p|capitalize) }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><label class="form-label">{{ _('Period start') }}</label><input type="date" name="period_start" class="form-control" value="{{ plan.get('period_start') or '' }}" required></div>
        <div class="col-md-4"><label class="form-label">{{ _('Period end') }}</label><input type="date" name="period_end" class="form-control" value="{{ plan.get('period_end') or '' }}" required></div>
        <div class="col-md-6"><label class="form-label">{{ _('Plant') }}</label>
          <select name="plant_id" class="form-select"><option value="">{{ _('All plants') }}</option>{% for p in plants %}<option value="{{ p.id }}">{{ p.code }} {{ p.name }}</option>{% endfor %}</select></div>
        <div class="col-12"><label class="form-label">{{ _('Notes') }}</label><textarea name="notes" class="form-control" rows="2">{{ plan.get('notes','') }}</textarea></div>
      </div></div></div>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> {{ _('Create plan') }}</button>
      <a href="{{ url_for('manufacturing.plans') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
    </form>
  </div>
</div>
{% endblock %}
