{% extends "multicompany/base.html" %}

{% block title %}{{ _('Login') }} - {{ _('Multi-Company Payroll Portal') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-building display-4 text-primary"></i>
                    <h3 class="mt-2">{{ _('Login') }}</h3>
                    <p class="text-muted">{{ _('Access your company payroll system') }}</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">{{ _('Username or Email') }}</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ _('Password') }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">{{ _('Remember me') }}</label>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">{{ _('Login') }}</button>
                </form>
                
                <div class="text-center mt-3">
                    <p class="mb-0">{{ _("Don't have an account?") }} <a href="{{ url_for('multicompany.company_register') }}">{{ _('Register here') }}</a></p>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = {
        username: formData.get('username'),
        password: formData.get('password')
    };
    
    fetch('/company/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            window.location.href = data.redirect;
        } else {
            alert('Login failed: ' + data.error);
        }
    })
    .catch(error => {
        alert('Login error: ' + error);
    });
});
</script>
{% endblock %}
