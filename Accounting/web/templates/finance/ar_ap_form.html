{% extends "base.html" %}
{% block title %}{{ _('New') }} {{ meta.label }} {{ _('Record') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi {{ 'bi-inbox' if kind == 'receivable' else 'bi-envelope-paper' }} text-primary"></i>
            {{ _('New') }} {{ meta.label }} {{ _('Record') }}
        </h2>
        <a href="{{ meta.base_url }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> {{ _('Back to %(label)s', label=meta.label) }}
        </a>
    </div>

    <div class="row">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <form method="post" action="{{ meta.base_url }}/new">
                        <div class="mb-3">
                            <label class="form-label">{{ meta.party_label }} <span class="text-danger">*</span></label>
                            <input type="text" name="party" class="form-control" required
                                   placeholder="{{ _('%(party)s name', party=meta.party_label) }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('Description') }}</label>
                            <textarea name="description" class="form-control" rows="2"
                                      placeholder="{{ _('Invoice / reference details') }}"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('Amount') }} (ETB) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">{{ _('Due Date') }}</label>
                            <input type="date" name="due_date" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> {{ _('Create Record') }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
