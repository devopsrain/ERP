[program:ethiopian-business]
command=/usr/local/bin/uvicorn run_production:app --host 127.0.0.1 --port 5000 --workers 3 --log-level info --access-log
directory=/opt/ethiopian-business
user=ubuntu
autostart=true
autorestart=true
startsecs=10
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/ethiopian-business.log
environment=PATH="/usr/local/bin:/usr/bin:/bin"
