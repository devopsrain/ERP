# ── nginx.conf — EBMS reverse proxy ──────────────────────────────────────────
# Routes:
#   /api/*  → api service on port 8001 (pure JSON REST)
#   /*      → web service on port 8000 (Jinja2 SSR)
#
# For HTTPS in production, uncomment the ssl_* lines and mount your cert/key
# into the nginx container at /etc/nginx/ssl/

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time rid=$http_x_request_id';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    client_max_body_size 50M;

    # ── Upstream pools ──────────────────────────────────────────────────
    upstream web_pool {
        server web:8000;
        keepalive 32;
    }

    upstream api_pool {
        server api:8001;
        keepalive 32;
    }

    # ── HTTP server ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Production HTTPS redirect (cert must exist before nginx restarts — deploy/setup-tls.sh handles ordering):
        return 301 https://$host$request_uri;

        # ── /api/* → standalone REST API service ──────────────────────
        location /api/ {
            proxy_pass         http://api_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        # ── /* → SSR web app ────────────────────────────────────────────
        location / {
            proxy_pass         http://web_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        # ── Health probe served directly by nginx ──────────────────────
        location = /nginx-health {
            return 200 "ok\n";
            access_log off;
        }
    }

    # ── HTTPS server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name ebms.devopsrain.com;

        ssl_certificate     /etc/letsencrypt/live/ebms.devopsrain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ebms.devopsrain.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        location /api/ {
            proxy_pass         http://api_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass         http://web_pool;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID      $request_id;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
        }

        location = /nginx-health {
            return 200 "ok\n";
            access_log off;
        }
    }
}
