apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-sim
  namespace: risk-sim
  labels:
    app: risk-sim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: risk-sim
  template:
    metadata:
      labels:
        app: risk-sim
    spec:
      # A single R430 typically ships 2 CPUs (e.g. 2x E5-2620 v4 = 16c/32t
      # total) and up to 768GB RAM. The numbers below assume you're sharing
      # the box with other workloads; a dedicated node can go higher.
      containers:
        - name: risk-sim
          image: risk-sim:1.0.0          # build & import/push locally — see README
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: risk-sim-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        fsGroup: 10001
